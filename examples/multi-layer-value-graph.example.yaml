boundary_model:
  scoring_boundary:
    enabled: true
    statement: "Scores and confidence values may assist review, but they must not become final value judgments."
    separates:
      from: "signal_assessment"
      to: "final_value_judgment"

  execution_boundary:
    enabled: true
    statement: "Governance actions may be recorded or recommended, but they must not automatically trigger compensation, enforcement, or legal consequence."
    separates:
      from: "governance_recommendation"
      to: "automatic_execution"

compatibility:
  compatible_with:
    - "v0.3"
  v0_3_graph_id: "value-graph-v03-baseline"
  migration_status: "partial"
  migration_notes: "This example shows how a v0.3-style Value Graph can be expanded into v0.4 graph layers."
  mapped_from:
    - from_path: "v0.3.value_graph.nodes"
      to_path: "v0.4.multi_layer_value_graph.nodes"
      notes: "v0.3 nodes remain valid as baseline nodes."
    - from_path: "v0.3.value_graph.edges"
      to_path: "v0.4.multi_layer_value_graph.edges"
      notes: "v0.3 edges are distributed across v0.4 graph layers."
    - from_path: "v0.3.policy_engine"
      to_path: "v0.4.policy_layer"
      notes: "The v0.3 policy engine becomes modular policy references in v0.4."

review_context:
  review_required: true
  review_mode: "human_reviewed_ai_assisted"
  review_notes: "This example should be reviewed before being used as a stable reference example."
  reviewers:
    - "human_reviewer"
