    confidence: 1.0
    review_status: "pending_review"
    boundary_classification: "review"
    created_at: "2026-06-06T00:00:00Z"

  - edge_id: "edge-governance-acknowledge"
    layer_id: "layer-governance"
    source_node_id: "governance-action-acknowledge"
    target_node_id: "edge-doc-to-spec"
    relationship_type: "governance_action"
    direction: "directed"
