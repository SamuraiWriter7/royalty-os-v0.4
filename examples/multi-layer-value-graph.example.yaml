    review_status: "pending_review"
    boundary_classification: "governance"
    created_at: "2026-06-06T00:00:00Z"

  - edge_id: "edge-os-event-created"
    layer_id: "layer-event"
    source_node_id: "os-event-graph-created"
    target_node_id: "spec-v04-draft"
    relationship_type: "os_event_link"
    direction: "directed"
    description: "An OS event records the creation of the v0.4 Multi-Layer Value Graph example."
