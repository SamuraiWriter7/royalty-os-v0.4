    source_node_id: "output-v04-structural-diff-doc"
    target_node_id: "spec-v04-draft"
    relationship_type: "reference"
    direction: "directed"
    description: "The draft specification references and translates the structural diff document."
    confidence: 1.0
    review_status: "approved_for_record"
    boundary_classification: "policy"
    evidence_references:
      - "docs/v0.4-structural-diff.md"
      - "specs/royalty-os-v0.4-draft.yaml"
    created_at: "2026-06-06T00:00:00Z"

  - edge_id: "edge-policy-applies-to-doc"
    layer_id: "layer-policy"
    source_node_id: "policy-attribution-v04"
    target_node_id: "output-v04-structural-diff-doc"
    relationship_type: "policy_application"
    direction: "directed"
    description: "The attribution policy module applies to the structural diff document."
    confidence: 0.9
    review_status: "pending_review"
    boundary_classification: "policy"
    policy_references:
      - "policy-attribution-v04"
    created_at: "2026-06-06T00:00:00Z"

  - edge_id: "edge-doc-review-state"
    layer_id: "layer-review"
    source_node_id: "output-v04-structural-diff-doc"
    target_node_id: "review-state-pending"
    relationship_type: "review_status"
    direction: "directed"
